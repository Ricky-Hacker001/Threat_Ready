<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found · ThreatReady</title>
  <!-- Served for any missing path, so everything is absolute or inline. Sign-in lives on onboard.threatready.io;
       the old threatready.io/app/ redirect is gone (it looped, because the site has no /app). -->
  <style>
    body{margin:0;background:#0B1020;color:#F3F5F9;font:16px/1.6 Inter,system-ui,sans-serif}
    main{max-width:560px;margin:0 auto;padding:96px 24px}
    .code{font:600 13px/1 ui-monospace,monospace;color:#8089A0;margin:0 0 12px}
    h1{font-size:36px;line-height:42px;margin:0 0 12px;letter-spacing:-.02em}
    .lead{color:#A3ACBF;margin:0 0 24px}
    .home{display:inline-block;background:#6D5DFC;color:#fff;padding:10px 16px;border-radius:6px;text-decoration:none;font-weight:600}
    .signin{color:#A59BFF;margin-left:16px;text-decoration:underline;text-underline-offset:3px}
    a:focus-visible{outline:2px solid #A59BFF;outline-offset:2px;border-radius:4px}
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found.</h1>
    <p class="lead">The page you asked for does not exist or has moved.</p>
    <p><a class="home" href="/">Back to ThreatReady</a> <a class="signin" href="https://onboard.threatready.io/">Sign in</a></p>
  </main>
</body>
</html>
