<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ThreatReady</title>
  <script type="text/javascript">
    var pathSegmentsToKeep = 1;
    var l = window.location;
    if (l.pathname.indexOf('/app/') === 0 || l.pathname === '/app') {
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    } else {
      document.addEventListener('DOMContentLoaded', function () {
      document.title = 'Page not found · ThreatReady';
      document.body.style.cssText = 'margin:0;background:#0B1020;color:#F3F5F9;font:16px/1.6 Inter,system-ui,sans-serif';
      document.body.innerHTML = '<main style="max-width:560px;margin:0 auto;padding:96px 24px"><p style="font:600 13px/1 ui-monospace,monospace;color:#8089A0;margin:0 0 12px">404</p><h1 style="font-size:36px;line-height:42px;margin:0 0 12px;letter-spacing:-.02em">Page not found.</h1><p style="color:#A3ACBF;margin:0 0 24px">The page you asked for does not exist or has moved.</p><p style="margin:0"><a href="/" style="display:inline-block;background:#6D5DFC;color:#fff;padding:10px 16px;border-radius:6px;text-decoration:none;font-weight:600">Back to ThreatReady</a> <a href="/app/" style="color:#A59BFF;margin-left:16px">Sign in</a></p></main>';
      });
    }
  </script>
</head>
<body></body>
</html>
