# Render Blueprint: the whole ThreatReady platform as ONE free web service.
# Every app is served from one URL (/, /interview-prep/, /labs/, /ar/) so one login works everywhere
# without a custom domain. Databases: Neon (free). Email: Resend (free). See deploy/README.md.
# On SIGTERM (deploy, restart, sleep) the launcher saves lab state within Render's 30 s shutdown delay.
services:
  - type: web
    name: threatready
    runtime: node
    plan: free
    region: singapore
    buildCommand: bash deploy/build.sh
    # Gateway heap: 48 MB. It proxies, serves static files and keeps the lab-state mirror; the apps run as
    # memory-capped children (onboard 110, InterviewPrep 180, labs 150; see deploy/README.md "Memory budget").
    startCommand: node --max-old-space-size=48 --max-semi-space-size=2 deploy/start.mjs
    # 503 "starting" while migrations run and, on a deploy, until every child (both APIs and the labs
    # child) is up: a broken deploy is never marked live and Render keeps the old version
    # (deploy/README.md, "Health check").
    healthCheckPath: /healthz
    # autoDeploy: true deploys every push to the branch, including one whose CI failed. Turn on
    # "Wait for CI" (service → Settings → Build & Deploy) so Render deploys only after the GitHub
    # checks pass, or set this to false and deploy from the dashboard / a deploy hook after CI.
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # --- Neon connection strings (direct, not "-pooler"), one database per app ---
      - key: ONBOARD_DATABASE_URL
        sync: false
      - key: INTERVIEW_DATABASE_URL
        sync: false
      # --- Generated once by Render; never shared ---
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: INTERNAL_API_TOKEN
        generateValue: true
      - key: ONBOARD_APP_DB_PASSWORD
        generateValue: true
      # --- Email (Resend): sign-up and password-reset codes ---
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # --- AI interviewer (InterviewPrep) ---
      - key: ANTHROPIC_API_KEY
        sync: false
      # Model id for the small tier (required in production since the 2026-10-23 patch 2). Current
      # default in InterviewPrep/apps/api/src/config/config.ts: claude-haiku-4-5. LLM_MODEL_LARGE
      # (default claude-sonnet-5-5) may be set the same way.
      - key: LLM_MODEL_SMALL
        value: claude-haiku-4-5
      # --- Cloudflare Turnstile (CAPTCHA on sign-up, sign-in and OTP requests). Set BOTH or none:
      #     without them production runs on rate limits alone (the launcher warns at start).
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # --- Optional: social sign-in. Redirect URIs: <service URL>/api/auth/callback/google and /github ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # --- Optional: platform admins (comma-separated verified emails) ---
      - key: ADMIN_EMAILS
        sync: false
      # --- Optional: error tracking (Sentry project DSN). Forwarded to the APIs; without it the
      #     service still boots and the launcher logs a warning. ---
      - key: SENTRY_DSN
        sync: false
      # --- Optional: where interview data is stored, as the AI consent notice states it (e.g. "Singapore").
      #     A legal decision; without it the notice names no location. ---
      - key: INTERVIEW_DATA_STORAGE_LOCATION
        sync: false
      # --- Optional: guest sessions without an account ("true" offers "Continue as a guest"; default
      #     off). The trial model is an owner decision; every app except onboard refuses guests. ---
      - key: TRIAL_ENABLED
        sync: false
      # --- Launcher switches (leave unset) ---
      # FORCE_ROLE_SYNC=true re-issues ALTER ROLE ... PASSWORD for the app role once even when the
      #   stored digest says the password is unchanged (e.g. after restoring the database).
      # INTERNAL_TOKEN_LEGACY_ACCEPT=true makes the children accept the raw INTERNAL_API_TOKEN again
      #   next to their per-caller tokens (default false in production; see deploy/README.md).
      # Other optional settings (client-IP source, body cap, lab-state mirror, each app's limits and
      # feature flags) have safe defaults: see deploy/README.md, "Settings".
