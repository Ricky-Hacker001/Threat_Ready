# Render blueprint. Recommended: deploy as a STATIC SITE (this file does that).
# In Render: New -> Blueprint, point at the repo, and it picks this up.
# (A Vite SPA builds to dist/ and needs no running server.)
services:
  - type: web
    name: ai-security-lab
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      # SPA fallback so any path serves the app shell.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
