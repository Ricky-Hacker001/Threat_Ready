# gitleaks configuration for the ThreatReady monorepo.
# The labs teach secret detection, so synthetic AWS-style key ids are part of the training content.
# Only the exact fake ids below, in the files that carry them, are allowed; anything else is a finding.
#
# No global [allowlist]: a global `paths` entry skips the whole file (and the global table has no
# `condition` before gitleaks 8.25), so a real key dropped into a lab fixture would be hidden.
# Instead each default rule that fires on the training data gets a rule-level allowlist with
# condition = "AND" (the TOML key is `condition`, not `matchCondition`): a match is ignored only when
# BOTH its value is one of the synthetic strings AND it sits in one of the listed files. Extending a
# default rule by id keeps its regex/entropy/keywords and appends the allowlist (gitleaks >= 8.21;
# CI's gitleaks-action downloads the current release). Verify a change with:
#   gitleaks dir . --config .gitleaks.toml --log-level trace 2>&1 | grep allowlist
title = "ThreatReady"

[extend]
useDefault = true

[[rules]]
id = "aws-access-token"
[[rules.allowlists]]
description = "Synthetic AWS key ids (never valid): DevSecOps labs, TR-CLOUD-001 fixture/scenario, SOC E04 + log noise, InterviewPrep security test, the audit report that quotes them"
condition = "AND"
regexTarget = "match"
regexes = [
  '''^AKIAFAKETRAININGKEY2$''',
  '''^AKIAFAKETRAININGKEY3$''',
  '''^AKIASYNTHNOVAAPP0001$''',
  '''^AKIASYNTHNOVAOLD0002$''',
  '''^AKIA4QX7LEAKED93KD2M$''',
  '''^AKIA4QX7CIDEPLOY7Q2M$''',
  '''^AKIATESTTESTTESTTEST$''',
]
paths = [
  '''DevSecOps-Simulation/src/content/labs/l1-secrets\.ts''',
  '''DevSecOps-Simulation/src/content/labs/l6-pipeline-gate\.ts''',
  '''threatready-lab-001/server/fixture\.ts''',
  '''threatready-lab-001/server/scenario\.ts''',
  '''soc/server/scenarios/expert/E04-aws-key\.js''',
  '''soc/server/engine/noise\.js''',
  '''InterviewPrep/apps/api/test/security\.e2e\.test\.ts''',
  '''audit/docs/AUDIT_REPORT_2026-10-15\.md''',
  '''\.gitleaks\.toml''',
]

# The generic rule also fires on `KEY = '<synthetic AKIA id>'` assignments and on the TR-CLOUD-001 data key.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Synthetic AWS key ids and the TR-CLOUD-001 data key (never valid), same files as above"
condition = "AND"
regexTarget = "match"
regexes = [
  '''AKIAFAKETRAININGKEY2''',
  '''AKIAFAKETRAININGKEY3''',
  '''AKIASYNTHNOVAAPP0001''',
  '''AKIASYNTHNOVAOLD0002''',
  '''AKIA4QX7LEAKED93KD2M''',
  '''AKIA4QX7CIDEPLOY7Q2M''',
  '''AKIATESTTESTTESTTEST''',
  '''a1b2c3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d''',
]
paths = [
  '''DevSecOps-Simulation/src/content/labs/l1-secrets\.ts''',
  '''DevSecOps-Simulation/src/content/labs/l6-pipeline-gate\.ts''',
  '''threatready-lab-001/server/fixture\.ts''',
  '''threatready-lab-001/server/scenario\.ts''',
  '''soc/server/scenarios/expert/E04-aws-key\.js''',
  '''soc/server/engine/noise\.js''',
  '''InterviewPrep/apps/api/test/security\.e2e\.test\.ts''',
  '''audit/docs/AUDIT_REPORT_2026-10-15\.md''',
  '''\.gitleaks\.toml''',
]
