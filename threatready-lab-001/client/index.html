<title>Lab Simulations · ThreatReady</title><style>/* The shared ThreatReady loading screen, from first paint until the app takes over (platform.css .tr-loading). */html{background:#0b1020}html[data-theme=light]{background:#fff}.tr-loading{min-height:100vh;display:grid;place-items:center;padding:48px 16px;margin:0;background:#0b1020;color:#a3acbf;font-family:"Inter Variable",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}html[data-theme=light] .tr-loading{background:#fff;color:#4b5565}.tr-loading-in{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}.tr-loading-radar{position:relative;width:104px;height:104px;display:grid;place-items:center;margin-bottom:6px}.tr-loading-radar img{position:relative;z-index:1;width:38px;height:37px}.tr-loading-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.tr-loading-track{fill:none;stroke:#243047;stroke-width:2}html[data-theme=light] .tr-loading-track{stroke:#e3e7ef}.tr-loading-sweep{fill:none;stroke:#6d5dfc;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:70 219;transform-origin:50% 50%;animation:tr-sweep 1.4s linear infinite}.tr-loading-ping{position:absolute;inset:0;border-radius:50%;border:1px solid #6d5dfc;opacity:0;animation:tr-ping 2.1s ease-out infinite}.tr-loading-mark{font-weight:700;font-size:18px;letter-spacing:-.01em;color:#f3f5f9}html[data-theme=light] .tr-loading-mark{color:#0b1020}.tr-loading-line{margin:0;font:13px/20px "JetBrains Mono Variable","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.tr-loading-prompt{color:#6d5dfc;margin-right:6px}.tr-loading-cursor{display:inline-block;width:7px;height:14px;margin-left:3px;vertical-align:-2px;background:#6d5dfc;animation:tr-blink 1s steps(2,start) infinite}@keyframes tr-sweep{to{transform:rotate(360deg)}}@keyframes tr-ping{0%{transform:scale(.62);opacity:.75}100%{transform:scale(1.3);opacity:0}}@keyframes tr-blink{to{visibility:hidden}}@media (prefers-reduc
