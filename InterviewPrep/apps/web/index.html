<!doctype html>

  <style>/* The shared ThreatReady loading screen, from first paint until the app takes over (platform.css .tr-loading). */html{background:#0b1020}html[data-theme=light]{background:#fff}.tr-loading{min-height:100vh;display:grid;place-items:center;padding:48px 16px;margin:0;background:#0b1020;color:#a3acbf;font-family:"Inter Variable",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}html[data-theme=light] .tr-loading{background:#fff;color:#4b5565}.tr-loading-in{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}.tr-loading-mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em;color:#f3f5f9}html[data-theme=light] .tr-loading-mark{color:#0b1020}.tr-loading-mark img{width:26px;height:25px}.tr-loading-bar{position:relative;width:180px;height:3px;border-radius:2px;background:#243047;overflow:hidden}html[data-theme=light] .tr-loading-bar{background:#e3e7ef}.tr-loading-bar i{position:absolute;top:0;bottom:0;left:-40%;width:40%;border-radius:2px;background:#6d5dfc;animation:tr-loading 1.1s cubic-bezier(.4,0,.2,1) infinite}.tr-loading p{margin:0;font-size:14px;line-height:20px}@keyframes tr-loading{to{left:100%}}@media (prefers-reduced-motion:reduce){.tr-loading-bar i{animation:none;left:30%}}</style></head>
  <body class="trp">
    <div id="root"><div class="trp tr-loading" role="status" aria-live="polite"><div class="tr-loading-in"><span class="tr-loading-mark"><img src="/logo-sm.png" alt="">ThreatReady</span><span class="tr-loading-bar" aria-hidden="true"><i></i></span><p>Opening InterviewPrep…</p></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
